<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Прикосновение неизвестного: Новеллы</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/playfair-display@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/playfair-display@5/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/playfair-display@5/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/playfair-display@5/400-italic.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/600.css">

<style>
:root{
  --paper:#faf6f0; --card:#fffdf9; --ink:#2c2c2c; --ink-soft:#6b6459; --ink-faint:#a39a8d;
  --accent:#8b3a3a; --accent-deep:#6f2d2d; --danger:#b3402e; --line:rgba(44,44,44,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:#faf6f0;overscroll-behavior-y:none}
html.night-bg{background:#1c1613}
body{
  font-family:'Inter',system-ui,sans-serif;color:var(--ink);min-height:100vh;
  background:
    radial-gradient(1100px 560px at 50% -8%, rgba(139,58,58,.06), transparent 62%),
    linear-gradient(180deg,#faf6f0 0%,#f5efe5 100%);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  transition:background-color .5s ease,color .5s ease;
}
body.locked{overflow:hidden}
::selection{background:rgba(139,58,58,.22)}
[hidden]{display:none !important}
.top-rule{position:fixed;top:0;left:0;right:0;height:3px;z-index:1500;
  background:linear-gradient(90deg,transparent,var(--accent) 18%,var(--accent) 82%,transparent);opacity:.85}
.ic{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.faved .ic{fill:currentColor}

.hero{padding:clamp(70px,10vh,130px) 22px clamp(30px,5vh,60px);text-align:center}
.hero-title{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(2rem,5.4vw,4rem);line-height:1.14;letter-spacing:-.01em;max-width:920px;margin:0 auto}
.hero-title .w{display:inline-block;opacity:0;animation:wordIn .85s cubic-bezier(.22,.61,.21,1) both;animation-delay:calc(.15s + var(--i)*.12s)}
.hero-title .w-accent{font-style:italic;font-weight:600;color:var(--accent)}
@keyframes wordIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.hero-sub{margin-top:24px;font-size:clamp(.7rem,1.6vw,.85rem);font-weight:500;text-transform:uppercase;letter-spacing:.42em;color:#7a7267;opacity:0;animation:subIn 1.3s cubic-bezier(.22,.61,.21,1) .8s both}
.about-footer{max-width:1120px;margin:0 auto;padding:10px 20px 70px;text-align:center}
.about-rule{color:rgba(139,58,58,.5);font-size:15px;margin-bottom:18px;user-select:none}
.about-title{font-size:.68rem;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:10px}
.about-text{font-family:'Playfair Display',serif;font-style:italic;font-size:.9rem;color:#8a8175}
body.night .about-rule{color:rgba(232,184,168,.5)}
body.night .about-title{color:#8d8070}
body.night .about-text{color:#9c8f7d}
@keyframes subIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.theme-btn{
  position:fixed;top:14px;right:14px;z-index:860;width:42px;height:42px;border-radius:50%;cursor:pointer;
  border:1px solid rgba(139,58,58,.4);background:rgba(255,253,249,.9);
  color:var(--accent);display:grid;place-items:center;
  transition:background .3s,color .3s,transform .3s,box-shadow .3s,border-color .3s;
  box-shadow:0 6px 18px -8px rgba(44,40,35,.35);
}
.theme-btn:hover{transform:scale(1.08)}
.theme-btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.theme-btn .ic{width:18px;height:18px}
.theme-btn.pop{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
.settings-btn{right:64px}

.overlay{position:fixed;inset:0;z-index:1300;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(30,23,18,.55);opacity:0;visibility:hidden;transition:opacity .25s ease,visibility 0s linear .25s}
.overlay.open{opacity:1;visibility:visible;transition:opacity .25s ease}
.settings-modal{position:relative;width:100%;max-width:420px;background:var(--card);border:1px solid rgba(44,44,44,.1);border-radius:10px;padding:30px 26px 26px;box-shadow:0 30px 70px -20px rgba(20,15,10,.5);transform:translateY(14px) scale(.98);opacity:0;transition:transform .3s cubic-bezier(.22,.61,.3,1),opacity .25s}
.overlay.open .settings-modal{transform:none;opacity:1}
.settings-close{position:absolute;top:14px;right:14px}
.settings-title{font-family:'Playfair Display',serif;font-weight:600;font-size:1.3rem;margin-bottom:22px}
.settings-field{margin-bottom:20px}
.settings-field label{display:block;font-size:.78rem;font-weight:600;letter-spacing:.03em;color:var(--ink-soft);margin-bottom:8px}
.settings-field input[type=number]{width:100px;padding:8px 10px;border:1px solid rgba(44,44,44,.2);border-radius:6px;font-size:.95rem;font-family:'Inter',sans-serif;color:var(--ink);background:var(--card)}
.settings-field input[type=number]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,58,58,.14)}

.switch-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.switch-row:last-of-type{border-bottom:none}
.switch-row span{font-size:.88rem;color:var(--ink)}
.switch-row small{display:block;font-size:.74rem;color:var(--ink-faint);margin-top:3px;font-weight:400}
.switch{position:relative;display:inline-block;width:42px;height:24px;flex:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch-track{position:absolute;inset:0;background:rgba(44,44,44,.2);border-radius:999px;transition:background .2s}
.switch-track::before{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked ~ .switch-track{background:var(--accent)}
.switch input:checked ~ .switch-track::before{transform:translateX(18px)}
.switch input:focus-visible ~ .switch-track{outline:2px solid var(--accent);outline-offset:2px}
.settings-reset-btn{width:100%;margin-top:6px;font-family:'Inter',sans-serif;font-size:.82rem;font-weight:600;color:var(--danger);background:rgba(179,64,46,.07);border:1px solid rgba(179,64,46,.25);border-radius:6px;padding:11px;cursor:pointer;transition:background .2s}
.settings-reset-btn:hover{background:rgba(179,64,46,.14)}

body.night .settings-modal{background:#2c241e;border-color:rgba(255,255,255,.1)}
body.night .settings-title{color:#e9ddcb}
body.night .settings-field label{color:#b3a48e}
body.night .settings-field input[type=number]{background:#241d18;color:#d6cabb;border-color:rgba(255,255,255,.14)}
body.night .switch-row{border-color:rgba(255,255,255,.1)}
body.night .switch-row span{color:#d6cabb}
body.night .switch-row small{color:#8d8070}
body.night .switch-track{background:rgba(255,255,255,.14)}
body.night .switch input:checked ~ .switch-track{background:#c98d76}
body.night .settings-close{color:#cbbfae}
body.night .settings-close:hover{background:rgba(232,184,168,.1);color:#e8b8a8}
body.night .settings-reset-btn{color:#e8907a;background:rgba(232,144,122,.08);border-color:rgba(232,144,122,.3)}
body.night .settings-reset-btn:hover{background:rgba(232,144,122,.15)}

.atmosphere-layer{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}
.atmosphere-particle{position:absolute;top:-8%;will-change:transform,opacity;animation:atmosphereFall linear infinite}
@keyframes atmosphereFall{
  0%{transform:translate(0,0);opacity:0}
  8%{opacity:var(--op,.6)}
  92%{opacity:var(--op,.6)}
  100%{transform:translate(var(--drift,20px),115vh);opacity:0}
}
@media (prefers-reduced-motion:reduce){
  .atmosphere-particle{display:none}
}

.view-tabs{display:flex;justify-content:center;gap:8px;max-width:1120px;margin:0 auto;padding:0 20px 22px}
.view-tab{font-family:'Inter',sans-serif;font-size:.8rem;font-weight:600;letter-spacing:.06em;color:var(--ink-faint);background:none;border:none;border-bottom:2px solid transparent;padding:8px 4px;cursor:pointer;transition:color .2s,border-color .2s}
.view-tab:hover{color:var(--ink)}
.view-tab.active{color:var(--accent);border-color:var(--accent)}
.library{max-width:1120px;margin:0 auto;padding:6px 20px 130px}
.updates-view{max-width:760px;margin:0 auto;padding:6px 20px 130px}
.updates-loading{display:flex;flex-direction:column;gap:16px}
.updates-loading .loading-card{height:90px}
.updates-list{display:flex;flex-direction:column;gap:0}
.update-item{position:relative;padding:4px 0 26px 28px;border-left:1px solid rgba(44,44,44,.14)}
.update-item:last-child{border-color:transparent}
.update-item::before{content:"";position:absolute;left:-5px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.update-date{font-size:.68rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px}
.update-title{font-family:'Playfair Display',serif;font-weight:600;font-size:1.15rem;margin-bottom:8px;color:var(--ink)}
.update-text{font-size:.92rem;line-height:1.65;color:var(--ink-soft);white-space:pre-line}
body.night .view-tab{color:#8d8070}
body.night .view-tab:hover{color:#d6cabb}
body.night .view-tab.active{color:#e8b8a8;border-color:#e8b8a8}
body.night .update-item{border-color:rgba(255,255,255,.12)}
body.night .update-item::before{background:#c98d76}
body.night .update-date{color:#8d8070}
body.night .update-title{color:#e9ddcb}
body.night .update-text{color:#b3a48e}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:26px;animation:fadeIn .5s both;position:relative;z-index:50}
.search{position:relative;display:flex;flex:1 1 100%}
@media(min-width:680px){.search{flex:1 1 240px}}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:#8a8175;pointer-events:none}
.search input{width:100%;font-family:'Inter',sans-serif;font-size:1rem;color:var(--ink);background:var(--card);border:1px solid rgba(44,44,44,.18);border-radius:5px;padding:9px 14px 9px 34px;transition:border-color .25s,box-shadow .25s,background-color .35s ease,color .35s ease}
.dd{position:relative}
.dd-btn{
  display:flex;align-items:center;gap:10px;font-family:'Inter',sans-serif;font-size:1rem;color:var(--ink);
  background:var(--card);border:1px solid rgba(44,44,44,.18);border-radius:5px;padding:9px 14px;cursor:pointer;
  transition:border-color .25s,box-shadow .25s,background-color .35s ease,color .35s ease;
}
.dd-label{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-btn:hover{border-color:rgba(139,58,58,.5)}
.dd-btn:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,58,58,.14)}
.dd-chevron{width:12px;height:12px;stroke:var(--accent);transition:transform .25s}
.dd-btn[aria-expanded="true"] .dd-chevron{transform:rotate(180deg)}
.dd-menu{
  position:absolute;top:calc(100% + 8px);left:0;z-index:120;min-width:100%;width:max-content;max-width:260px;
  background:var(--card);border:1px solid rgba(44,44,44,.14);border-radius:8px;padding:6px;
  box-shadow:0 20px 44px -18px rgba(20,15,10,.5);transform-origin:top left;animation:popIn .18s ease both;
}
@keyframes popIn{from{opacity:0;transform:scale(.96) translateY(-4px)}to{opacity:1;transform:none}}
.dd-item{display:block;width:100%;text-align:left;border:none;background:none;font-family:'Inter',sans-serif;font-size:.86rem;color:var(--ink);cursor:pointer;padding:9px 12px;border-radius:6px;transition:background .2s,color .2s}
.dd-item:hover{background:rgba(139,58,58,.08);color:var(--accent)}
.dd-item.active{color:var(--accent);font-weight:600}
.dd-item.active::after{content:"✓";float:right;margin-left:14px}
.search input:focus,.dd-btn:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,58,58,.14)}
.chip{font-family:'Inter',sans-serif;font-size:.78rem;font-weight:600;letter-spacing:.04em;padding:9px 15px;border-radius:999px;border:1px solid rgba(139,58,58,.45);background:transparent;color:var(--accent);cursor:pointer;transition:.25s;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip:hover{background:rgba(139,58,58,.08)}
.chip.active{background:var(--accent);color:#fdf9f3;border-color:var(--accent);box-shadow:0 6px 14px -6px rgba(139,58,58,.6)}
.chip.continue{max-width:320px;font-family:'Playfair Display',serif;font-style:italic;font-weight:400;font-size:.85rem;letter-spacing:.02em}
.mode-badge{margin-left:auto;font-size:.6rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;padding:5px 11px;border-radius:999px;border:1px solid rgba(44,44,44,.22);color:var(--ink-faint);white-space:nowrap;transition:.3s}
.mode-badge.author{border-color:rgba(139,58,58,.55);color:var(--accent);background:rgba(139,58,58,.08)}
.count{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);white-space:nowrap}

.grid{display:grid;grid-template-columns:1fr;gap:22px}
@media(min-width:560px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:920px){.grid{grid-template-columns:repeat(3,1fr);gap:26px}}
.empty{text-align:center;padding:70px 0 30px;font-size:.78rem;letter-spacing:.16em;color:var(--ink-faint);animation:fadeIn .7s both}
.empty-orn{display:block;font-size:1.4rem;letter-spacing:0;margin-bottom:14px;color:rgba(139,58,58,.55)}
.loading-grid{display:none;grid-template-columns:1fr;gap:22px}
.loading-grid.active{display:grid}
@media(min-width:560px){.loading-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:920px){.loading-grid{grid-template-columns:repeat(3,1fr);gap:26px}}
.loading-card{height:220px;border-radius:6px;background:rgba(139,58,58,.08);border:1px solid rgba(44,44,44,.08);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
body.night .loading-card{background:rgba(232,184,168,.07);border-color:rgba(255,255,255,.08)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.card{position:relative;display:flex;flex-direction:column;gap:12px;background:linear-gradient(180deg,#fffdf9,#fbf7ef);border:1px solid rgba(44,44,44,.10);border-radius:6px;padding:26px 24px 22px;cursor:pointer;overflow:hidden;box-shadow:0 1px 2px rgba(44,40,35,.05),0 14px 30px -22px rgba(44,40,35,.45);transition:transform .35s cubic-bezier(.22,.61,.3,1),box-shadow .35s,border-color .35s,background-color .4s ease;animation:cardIn .55s cubic-bezier(.22,.61,.3,1) both;animation-delay:var(--d,0s)}
@keyframes cardIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-6px);border-color:rgba(139,58,58,.38);box-shadow:0 2px 3px rgba(44,40,35,.06),0 26px 46px -20px rgba(44,40,35,.45)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.card-progress{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--accent),#a34e4e);transition:width .5s ease}
.card-progress-label{position:absolute;right:12px;bottom:9px;font-size:.62rem;font-weight:600;letter-spacing:.03em;color:var(--ink-faint)}
.card-orn{display:flex;align-items:center;gap:10px;color:rgba(139,58,58,.8);font-size:13px;line-height:1;margin-bottom:2px;user-select:none}
.card-orn::before,.card-orn::after{content:"";height:1px;flex:1}
.card-orn::before{background:linear-gradient(90deg,transparent,rgba(139,58,58,.42))}
.card-orn::after{background:linear-gradient(90deg,rgba(139,58,58,.42),transparent)}
.card-title{font-family:'Playfair Display',serif;font-size:1.35rem;font-weight:600;line-height:1.25;transition:color .3s;padding-right:64px}
.card:hover .card-title{color:var(--accent-deep)}
.card-desc{font-family:'Playfair Display',serif;font-style:italic;font-size:.95rem;line-height:1.5;color:#6e5f58}
.card-author{font-size:.72rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-top:-6px}
.card-tag{display:inline-block;max-width:100%;font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);background:rgba(44,44,44,.07);border:1px solid rgba(44,44,44,.14);border-radius:999px;padding:4px 10px;margin-bottom:2px;white-space:normal;line-height:1.4}
.card-tag.canon{color:var(--accent);background:rgba(139,58,58,.07);border-color:rgba(139,58,58,.2)}
.card-tag.canon-main{color:#fdf9f3;background:var(--accent);border-color:var(--accent)}
.recent-row{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap;animation:fadeIn .5s both}
.recent-label{font-size:.68rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);white-space:nowrap}
.recent-list{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.recent-item{font-family:'Playfair Display',serif;font-style:italic;font-size:.85rem;letter-spacing:.01em;padding:8px 15px;border-radius:999px;border:1px solid rgba(139,58,58,.3);background:var(--card);color:#6e5f58;cursor:pointer;transition:.25s;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent-item:hover{border-color:rgba(139,58,58,.6);color:var(--accent-deep);background:rgba(139,58,58,.06)}
.recent-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card-preview{font-size:.9rem;line-height:1.65;color:var(--ink-soft)}
.card-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:14px;border-top:1px dashed rgba(44,44,44,.16)}
.card-date{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
.card-cta{font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);opacity:0;transform:translateX(-6px);transition:opacity .3s,transform .3s}
@media(hover:hover){.card:hover .card-cta,.card:focus-visible .card-cta{opacity:1;transform:none}}
@media(hover:none){.card-cta{opacity:.85;transform:none}}
.card-actions{position:absolute;top:8px;right:8px;display:flex;gap:2px;z-index:2}
.icon-btn{width:34px;height:34px;border-radius:50%;border:none;background:transparent;cursor:pointer;display:grid;place-items:center;opacity:.4;transition:opacity .25s,background .25s,transform .25s,color .25s;color:var(--ink-soft)}
.icon-btn .ic{width:16px;height:16px}
.icon-btn:hover{opacity:1;background:rgba(139,58,58,.12);transform:scale(1.1);color:var(--accent)}
.icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px;opacity:1}
@media(hover:none){.icon-btn{opacity:.7}}
.card-fav{position:absolute;top:8px;left:8px;z-index:2}
.card-fav.faved{color:var(--accent);opacity:.95}
.card-fav.pop,.tool-btn.pop{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.45)}100%{transform:scale(1)}}


.read-meta{text-align:center;font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:#a09889;margin-bottom:20px}
.read-title{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(1.7rem,4vw,2.6rem);line-height:1.2;text-align:center}
.read-desc{font-family:'Playfair Display',serif;font-style:italic;text-align:center;color:#6e5f58;font-size:1.05rem;line-height:1.6;max-width:52ch;margin:16px auto 0}
.read-author{text-align:center;font-size:.78rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-top:10px}
.read-rule{display:flex;align-items:center;justify-content:center;gap:14px;margin:30px auto 34px;color:rgba(139,58,58,.75);font-size:15px;user-select:none}
.read-rule::before,.read-rule::after{content:"";width:64px;height:1px}
.read-rule::before{background:linear-gradient(90deg,transparent,rgba(139,58,58,.5))}
.read-rule::after{background:linear-gradient(90deg,rgba(139,58,58,.5),transparent)}
.read-text{max-width:64ch;margin:0 auto;font-size:var(--rfs,17px);line-height:1.9;color:#38332c;transition:font-size .2s;overflow-wrap:break-word}
.read-text p{margin-bottom:1.2em}
.read-text p.drop-cap::first-letter{font-family:'Playfair Display',serif;font-weight:600;font-size:3.4em;line-height:.82;float:left;padding:6px 10px 0 0;color:var(--accent)}
.chapter-title{display:flex;align-items:center;justify-content:center;gap:16px;font-family:'Playfair Display',serif;font-weight:600;font-size:.95rem;letter-spacing:.3em;text-transform:uppercase;color:var(--accent-deep);margin:2.4em 0 1.8em;text-align:center}
.chapter-title::before,.chapter-title::after{content:"";height:1px;width:56px;background:rgba(139,58,58,.45);flex:none}
.text-divider{text-align:center;margin:2em 0;color:rgba(139,58,58,.7);font-size:1.05rem;letter-spacing:.6em;padding-left:.6em;user-select:none}
.read-end{text-align:center;margin-top:56px;color:rgba(139,58,58,.6);font-size:1.15rem;letter-spacing:.6em;padding-left:.6em;user-select:none}

.reader-shell{position:fixed;inset:0;z-index:1100;background-color:#faf6f0;background-image:radial-gradient(1000px 500px at 50% -10%, rgba(139,58,58,.05), transparent 60%),linear-gradient(180deg,#faf6f0,#f5efe5);transform:translateX(100%);visibility:hidden;transition:transform .5s cubic-bezier(.22,.61,.21,1),visibility 0s linear .5s;overflow:hidden}
.reader{height:100%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.reader-shell.open{transform:none;visibility:visible;transition:transform .5s cubic-bezier(.22,.61,.21,1)}
.reader-bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;background:rgba(250,246,240,.92);border-bottom:1px solid var(--line)}
.reader-progress{position:absolute;left:0;right:0;bottom:-1px;height:2px}
.reader-progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#a34e4e);transition:width .15s linear}
.reader-back{border:none;background:none;cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:5px;transition:.25s}
.reader-back .ic{width:16px;height:16px;transition:transform .25s}
.reader-back:hover{color:var(--accent);background:rgba(139,58,58,.08)}
.reader-back:hover .ic{transform:translateX(-4px)}
.reader-back:focus-visible{outline:2px solid var(--accent)}
.reader-bar-title{flex:1;text-align:center;font-family:'Playfair Display',serif;font-style:italic;font-size:.95rem;color:#6e5f58;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
@media(max-width:760px){.reader-bar-title{display:none}}
.reader-tools{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.tool-btn{min-width:36px;height:36px;padding:0 8px;border-radius:6px;cursor:pointer;border:1px solid rgba(44,44,44,.16);background:var(--card);color:var(--ink-soft);font-family:'Inter',sans-serif;font-size:.8rem;line-height:1;display:grid;place-items:center;transition:.25s}
.tool-btn .ic{width:16px;height:16px}
.tool-btn:hover{border-color:rgba(139,58,58,.5);color:var(--accent);background:rgba(139,58,58,.06)}
.tool-btn:focus-visible{outline:2px solid var(--accent)}
.tool-btn:disabled{opacity:.35;cursor:default;pointer-events:none}
.tool-btn.faved{color:var(--accent)}
.reader-page{max-width:820px;margin:0 auto;padding:clamp(36px,7vh,72px) 24px 100px}
.reader-shell.open .reader-page{animation:pageIn .55s .12s cubic-bezier(.22,.61,.3,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.reader-shell.night{background-color:#1c1613;background-image:linear-gradient(180deg,#241d18,#1c1613)}
.reader-shell.night .reader-bar{background:rgba(36,29,24,.94);border-color:rgba(255,255,255,.09)}
.reader-shell.night .reader-back{color:#cbbfae}

.reader-shell.night .read-rule::after{background:linear-gradient(90deg,rgba(232,184,168,.4),transparent)}
.reader-shell.night .chapter-title{color:#e0cdae}

.reader-shell.night .text-divider{color:rgba(232,184,168,.55)}

.reader-shell.night .reader-progress-fill{background:linear-gradient(90deg,#e8b8a8,#c98d76)}
.toc-panel{position:sticky;top:0;z-index:9;max-width:820px;margin:0 auto;background:var(--card);border:1px solid rgba(44,44,44,.12);border-top:none;box-shadow:0 16px 34px -18px rgba(20,15,10,.45);max-height:min(60vh,420px);overflow-y:auto;animation:pageIn .25s ease both}
.toc-head{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;font-family:'Playfair Display',serif;font-style:italic;font-size:.95rem;color:#6e5f58;border-bottom:1px solid var(--line);background:var(--card)}
.toc-close-btn{width:30px;height:30px;border-radius:50%;border:none;background:transparent;color:#7a7267;cursor:pointer;display:grid;place-items:center;transition:background .2s,color .2s}

.toc-item:hover{background:rgba(139,58,58,.08);color:var(--accent)}
.toc-empty{padding:16px;font-size:.8rem;color:var(--ink-faint);text-align:center}
.reader-shell.night .toc-panel{background:#2c241e;border-color:rgba(255,255,255,.12)}

.reader-shell.night .read-canon-tag.canon-main{color:#e8b8a8}

.to-top{position:fixed;z-index:1150;right:max(18px,env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom));width:46px;height:46px;border-radius:50%;cursor:pointer;border:1px solid rgba(139,58,58,.4);background:var(--card);color:var(--accent);display:grid;place-items:center;box-shadow:0 10px 24px -10px rgba(44,40,35,.4);opacity:0;transform:translateY(12px);pointer-events:none;transition:.3s}
.to-top .ic{width:18px;height:18px}
.to-top.visible{opacity:1;transform:none;pointer-events:auto}
.to-top:hover{background:var(--accent);color:#fdf9f3}
.remaining-badge{position:fixed;z-index:1150;right:max(74px,calc(env(safe-area-inset-right) + 74px));bottom:max(22px,env(safe-area-inset-bottom));padding:0 16px;height:46px;display:flex;align-items:center;border-radius:999px;background:var(--card);border:1px solid rgba(139,58,58,.3);color:#6e5f58;font-family:'Playfair Display',serif;font-style:italic;font-size:.82rem;white-space:nowrap;box-shadow:0 10px 24px -10px rgba(44,40,35,.4);opacity:0;transform:translateY(12px);pointer-events:none;transition:.3s}
.remaining-badge.visible{opacity:1;transform:none}
.remaining-badge.night{background:#2c241e;border-color:rgba(232,184,168,.35);color:#cbbfae}


.toast{position:fixed;left:50%;bottom:26px;z-index:2200;transform:translate(-50%,16px);background:#2c2c2c;color:#f5efe6;font-size:.82rem;letter-spacing:.05em;padding:11px 22px;border-radius:999px;display:flex;align-items:center;gap:16px;box-shadow:0 12px 30px -10px rgba(20,15,10,.5);opacity:0;pointer-events:none;transition:opacity .35s,transform .35s cubic-bezier(.22,.61,.3,1);max-width:calc(100vw - 40px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast-action{border:none;background:none;cursor:pointer;color:#e8b8a8;font-family:'Inter',sans-serif;font-size:.8rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 0;border-bottom:1px solid rgba(232,184,168,.5);transition:color .2s}
.toast-action:hover{color:#ffd9c9}

<script>
(function(){
'use strict';

var MANIFEST_URL = 'novels/manifest.json';

var SETTINGS_KEY  = 'unknown-touch-settings-v1';
var PROGRESS_KEY  = 'unknown-touch-progress-v1';
var FAVORITES_KEY = 'unknown-touch-favorites-v1';
var HISTORY_KEY    = 'unknown-touch-history-v1';

var novels = [];
var favoriteSet = loadFavorites();
var settings = loadSettings();
var progressMap = loadProgress();
var historyMap = loadHistory();
var searchQuery = '';
var currentNovel = null;
var readerIsOpen = false;
var lastFocused = null;
var toastTimer = null;
var continueNovel = null;
var currentTotalMinutes = 0;

var gridEl = document.getElementById('grid');
var emptyEl = document.getElementById('emptyNote');
var toolbarEl = document.getElementById('toolbar');
var loadingGrid = document.getElementById('loadingGrid');
var libraryView = document.getElementById('libraryView');
var updatesView = document.getElementById('updatesView');
var tabLibrary = document.getElementById('tabLibrary');
var tabUpdates = document.getElementById('tabUpdates');
var updatesLoading = document.getElementById('updatesLoading');
var updatesEmpty = document.getElementById('updatesEmpty');
var updatesList = document.getElementById('updatesList');
var searchInput = document.getElementById('searchInput');
var favFilter = document.getElementById('favFilter');
var continueBtn = document.getElementById('continueBtn');
var countLabel = document.getElementById('countLabel');
var recentRow = document.getElementById('recentRow');
var recentList = document.getElementById('recentList');

var readerShell = document.getElementById('readerShell');
var reader = document.getElementById('reader');
var readerBack = document.getElementById('readerBack');
var readerBarTitle = document.getElementById('readerBarTitle');
var progressFill = document.getElementById('progressFill');
var readMeta = document.getElementById('readMeta');
var readTitle = document.getElementById('readTitle');
var readDesc = document.getElementById('readDesc');
var readAuthor = document.getElementById('readAuthor');
var readCanonTag = document.getElementById('readCanonTag');
var readText = document.getElementById('readText');
var tocBtn = document.getElementById('tocBtn');
var tocPanel = document.getElementById('tocPanel');
var tocList = document.getElementById('tocList');
var tocClose = document.getElementById('tocClose');
var fontMinus = document.getElementById('fontMinus');
var fontPlus = document.getElementById('fontPlus');
var readerFav = document.getElementById('readerFav');
var readerDownload = document.getElementById('readerDownload');
var readerShare = document.getElementById('readerShare');
var siteThemeToggle = document.getElementById('siteThemeToggle');
var siteThemeUse = document.getElementById('siteThemeUse');
var toTop = document.getElementById('toTop');
var remainingBadge = document.getElementById('remainingBadge');
var settingsBtn = document.getElementById('settingsBtn');
var settingsOverlay = document.getElementById('settingsOverlay');
var settingsClose = document.getElementById('settingsClose');
var fontSizeInput = document.getElementById('fontSizeInput');
var atmosphereToggle = document.getElementById('atmosphereToggle');
var reduceMotionToggle = document.getElementById('reduceMotionToggle');
var resetDataBtn = document.getElementById('resetDataBtn');
var atmosphereLayer = document.getElementById('atmosphereLayer');
var settingsIsOpen = false;

var toast = document.getElementById('toast');
var toastMsg = document.getElementById('toastMsg');
var toastAction = document.getElementById('toastAction');

var dateFmt = new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',year:'numeric'});
var chapterRe = /^глава\s+\S.{0,60}$/i;
var dividerRe = /^(❦|✦|⁂|\*{3,}|-{3,})$/;

var FONT_MIN = 14, FONT_MAX = 28;
function loadSettings(){
  var def = {sort:'new', favOnly:false, fontSize:17, theme:'day', canonFilter:'all', atmosphere:false, reduceMotion:false};
  try{
    var raw = localStorage.getItem(SETTINGS_KEY);
    if(!raw) return def;
    var o = JSON.parse(raw);
    var themeVal = o.theme || o.readerTheme; // readerTheme — старое имя поля из прошлой версии
    return {
      sort: ['old','size-desc','size-asc'].indexOf(o.sort) !== -1 ? o.sort : 'new',
      favOnly: !!o.favOnly,
      fontSize: Math.min(FONT_MAX, Math.max(FONT_MIN, parseInt(o.fontSize,10)||17)),
      theme: themeVal==='night' ? 'night' : 'day',
      canonFilter: ['canon','canon-main','noncanon'].indexOf(o.canonFilter) !== -1 ? o.canonFilter : 'all',
      atmosphere: !!o.atmosphere,
      reduceMotion: !!o.reduceMotion
    };
  }catch(err){ return def; }
}
function saveSettings(){ try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }catch(err){} }
function loadProgress(){
  try{
    var raw = localStorage.getItem(PROGRESS_KEY);
    var o = raw ? JSON.parse(raw) : {};
    return (o && typeof o==='object') ? o : {};
  }catch(err){ return {}; }
}
function saveProgress(){ try{ localStorage.setItem(PROGRESS_KEY, JSON.stringify(progressMap)); }catch(err){} }
function loadFavorites(){
  try{
    var raw = localStorage.getItem(FAVORITES_KEY);
    var a = raw ? JSON.parse(raw) : [];
    return new Set(Array.isArray(a) ? a : []);
  }catch(err){ return new Set(); }
}
function saveFavorites(){ try{ localStorage.setItem(FAVORITES_KEY, JSON.stringify(Array.from(favoriteSet))); }catch(err){} }
function loadHistory(){
  try{
    var raw = localStorage.getItem(HISTORY_KEY);
    var o = raw ? JSON.parse(raw) : {};
    return (o && typeof o==='object') ? o : {};
  }catch(err){ return {}; }
}
function saveHistory(){ try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(historyMap)); }catch(err){} }
function markOpened(id){
  historyMap[id] = Date.now();
  saveHistory();
}

function plural(n, forms){
  var a = Math.abs(n)%100, b = a%10;
  if(a>10 && a<20) return forms[2];
  if(b>1 && b<5) return forms[1];
  if(b===1) return forms[0];
  return forms[2];
}
function debounce(fn, ms){
  var t;
  return function(){ var a = arguments, c = this; clearTimeout(t); t = setTimeout(function(){ fn.apply(c,a); }, ms); };
}
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function stripInline(t){ return t.replace(/\*\*/g,'').replace(/\*/g,''); }
function plainText(text){
  return stripInline(text).split('\n').filter(function(l){
    var t = l.trim();
    return t && !chapterRe.test(t) && !dividerRe.test(t);
  }).join(' ');
}
function previewOf(text){
  var t = plainText(text).replace(/\s+/g,' ').trim();
  if(t.length > 100) return t.slice(0,100).trimEnd() + '…';
  return t;
}
function wordCount(text){ return text.trim().split(/\s+/).filter(Boolean).length; }
function readingTime(text){ return Math.max(1, Math.round(wordCount(text)/180)); }
function toTimestamp(v){
  if(v === undefined || v === null || v === '') return 0;
  if(typeof v === 'number') return v;
  var t = Date.parse(v);
  return isNaN(t) ? 0 : t;
}
function showToast(msg){
  toastMsg.textContent = msg;
  toastAction.hidden = true;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 2600);
}

function inlineHtml(escaped){
  return escaped
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g,'<em>$1</em>');
}
function buildBlocks(container, text){
  container.innerHTML = '';
  var firstPara = null;
  var paraLines = [];
  var chapters = [];
  function flush(){
    if(!paraLines.length) return;
    var p = document.createElement('p');
    p.className = 'rp';
    p.innerHTML = paraLines.map(function(ln){ return inlineHtml(escapeHtml(ln)); }).join('<br>');
    if(!firstPara) firstPara = p;
    container.appendChild(p);
    paraLines = [];
  }
  text.split(/\n{2,}/).forEach(function(raw){
    raw.split('\n').forEach(function(line){
      var t = line.trim();
      if(!t) return;
      if(dividerRe.test(t)){
        flush();
        var d = document.createElement('div');
        d.className = 'text-divider';
        d.textContent = t;
        container.appendChild(d);
        return;
      }
      if(chapterRe.test(t)){
        flush();
        var h = document.createElement('h3');
        h.className = 'chapter-title';
        h.textContent = t;
        h.id = 'ch-' + chapters.length;
        container.appendChild(h);
        chapters.push({ id: h.id, title: t });
        return;
      }
      paraLines.push(t);
    });
    flush();
  });
  if(firstPara) firstPara.classList.add('drop-cap');
  return chapters;
}

function titleFromFilename(id){
  var s = id.replace(/[-_]+/g, ' ').trim();
  return s.replace(/(^|\s)([a-zA-Zа-яёА-ЯЁ0-9])/g, function(m, sp, ch){ return sp + ch.toUpperCase(); });
}

function canonCategory(raw){
  var v = (raw || '').toLowerCase().trim();
  if(['нет','no','false','0','не канон','неканон'].includes(v)) return 'noncanon';
  if(['продолжение','main','sequel','канон+продолжение','канон + продолжение','основной сюжет','продолжение основного сюжета'].includes(v)) return 'canon-main';
  return 'canon';
}
function canonLabel(category){
  if(category === 'canon-main') return 'Канон + продолжение основного сюжета';
  if(category === 'canon') return 'Канон';
  return 'Не канон';
}

function parseNovelText(raw, fallbackTitle){
  var lines = raw.replace(/^\uFEFF/, '').split(/\r\n|\r|\n/);
  var meta = {};
  var bodyStart = 0;
  if(lines.length && lines[0].trim() === '==='){
    var i = 1;
    for(; i < lines.length; i++){
      if(lines[i].trim() === '==='){ i++; break; }
      var m = lines[i].match(/^([A-Za-zА-Яа-яЁё]+)\s*:\s*(.*)$/);
      if(m) meta[m[1].trim().toLowerCase()] = m[2].trim();
    }
    if(lines[i] !== undefined && lines[i].trim() === '') i++;
    bodyStart = i;
  }
  var body = lines.slice(bodyStart).join('\n').replace(/\s+$/, '');
  return {
    title: meta.title || fallbackTitle,
    description: meta.description || '',
    author: meta.author || '',
    createdAt: meta.createdat || meta.created || meta.date || '',
    category: canonCategory(meta.canon),
    text: body
  };
}

var UPDATES_URL = 'updates.json';
var updatesLoaded = false;
var updateDateFmt = new Intl.DateTimeFormat('ru-RU', {day:'numeric', month:'long', year:'numeric'});
function formatUpdateDate(v){
  var t = toTimestamp(v);
  if(!t) return '';
  try{ return updateDateFmt.format(new Date(t)); }catch(err){ return ''; }
}
function renderUpdates(list){
  updatesList.innerHTML = '';
  if(!list.length){
    updatesEmpty.hidden = false;
    return;
  }
  updatesEmpty.hidden = true;
  list.forEach(function(u){
    var item = document.createElement('article');
    item.className = 'update-item';
    var dateStr = formatUpdateDate(u.date);
    if(dateStr){
      var dateEl = document.createElement('p');
      dateEl.className = 'update-date';
      dateEl.textContent = dateStr;
      item.appendChild(dateEl);
    }
    var titleEl = document.createElement('h3');
    titleEl.className = 'update-title';
    titleEl.textContent = String(u.title || '');
    item.appendChild(titleEl);
    if(u.text){
      var textEl = document.createElement('p');
      textEl.className = 'update-text';
      textEl.textContent = String(u.text);
      item.appendChild(textEl);
    }
    updatesList.appendChild(item);
  });
}
function loadUpdatesIfNeeded(){
  if(updatesLoaded) return;
  updatesLoaded = true;
  updatesLoading.hidden = false;
  fetch(UPDATES_URL, { cache:'no-cache' })
    .then(function(r){ return r.ok ? r.json() : []; })
    .then(function(list){
      if(!Array.isArray(list)) list = [];
      updatesLoading.hidden = true;
      renderUpdates(list);
    })
    .catch(function(){
      updatesLoading.hidden = true;
      renderUpdates([]);
      showToast('Не удалось загрузить список обновлений (updates.json)');
    });
}
function switchView(view){
  var isLibrary = view !== 'updates';
  libraryView.hidden = !isLibrary;
  updatesView.hidden = isLibrary;
  tabLibrary.classList.toggle('active', isLibrary);
  tabLibrary.setAttribute('aria-pressed', String(isLibrary));
  tabUpdates.classList.toggle('active', !isLibrary);
  tabUpdates.setAttribute('aria-pressed', String(!isLibrary));
  if(!isLibrary) loadUpdatesIfNeeded();
}
tabLibrary.addEventListener('click', function(){ switchView('library'); });
tabUpdates.addEventListener('click', function(){ switchView('updates'); });

function loadNovels(){
  loadingGrid.classList.add('active');
  emptyEl.hidden = true;
  return fetch(MANIFEST_URL, { cache:'no-cache' })
    .then(function(r){
      if(!r.ok) throw new Error('MANIFEST');
      return r.json();
    })
    .then(function(files){
      if(!Array.isArray(files)) throw new Error('MANIFEST');
      return Promise.all(files.map(function(file){
        var id = String(file).replace(/\.(json|txt)$/i, '');
        var isJson = /\.json$/i.test(file);
        return fetch('novels/' + file, { cache:'no-cache' })
          .then(function(r){ return r.ok ? r.text() : null; })
          .then(function(raw){
            if(raw === null) return null;
            var data;
            if(isJson){
              try{ data = JSON.parse(raw); }catch(e){ return null; }
              if(!data || !data.title || !data.text) return null;
              var jsonCategory = data.canon === false ? 'noncanon' : (typeof data.canon === 'string' ? canonCategory(data.canon) : 'canon');
              data = {
                title: String(data.title),
                description: String(data.description || ''),
                author: String(data.author || ''),
                createdAt: data.createdAt,
                updatedAt: data.updatedAt,
                category: jsonCategory,
                text: String(data.text)
              };
            }else{
              data = parseNovelText(raw, titleFromFilename(id));
              if(!data.title || !data.text.trim()) return null;
            }
            return {
              id: id,
              title: data.title,
              description: data.description || '',
              author: data.author || '',
              category: data.category || 'canon',
              text: data.text,
              createdAt: toTimestamp(data.createdAt) || toTimestamp(data.updatedAt),
              updatedAt: toTimestamp(data.updatedAt) || toTimestamp(data.createdAt),
              favorite: favoriteSet.has(id)
            };
          })
          .catch(function(){ return null; });
      }));
    })
    .then(function(list){
      var base = Date.now();
      list.forEach(function(n, idx){
        if(!n) return;
        if(!n.createdAt){ n.createdAt = base + idx; }
        if(!n.updatedAt){ n.updatedAt = n.createdAt; }
        n.wordCount = wordCount(stripInline(n.text));
      });
      novels = list.filter(Boolean);
      loadingGrid.classList.remove('active');
      render(true);
      tryOpenFromHash();
    })
    .catch(function(){
      novels = [];
      loadingGrid.classList.remove('active');
      render(false);
      showToast('Не удалось загрузить список новелл (novels/manifest.json)');
    });
}

function getVisibleNovels(){
  var list = novels.slice();
  if(settings.favOnly) list = list.filter(function(n){ return n.favorite; });
  if(settings.canonFilter !== 'all') list = list.filter(function(n){ return n.category === settings.canonFilter; });
  var q = searchQuery.trim().toLowerCase();
  if(q){
    list = list.filter(function(n){
      return (n.title + ' ' + (n.description||'') + ' ' + stripInline(n.text)).toLowerCase().indexOf(q) !== -1;
    });
  }
  if(settings.sort==='old') list.sort(function(a,b){ return (a.createdAt||0)-(b.createdAt||0); });
  else if(settings.sort==='size-desc') list.sort(function(a,b){ return (b.wordCount||0)-(a.wordCount||0); });
  else if(settings.sort==='size-asc') list.sort(function(a,b){ return (a.wordCount||0)-(b.wordCount||0); });
  else list.sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
  return list;
}

function render(animate){
  if(animate === undefined) animate = true;
  gridEl.innerHTML = '';
  toolbarEl.hidden = novels.length === 0;
  updateContinue();
  renderRecent();
  if(novels.length === 0){
    emptyEl.textContent = 'Нет опубликованных новелл';
    emptyEl.hidden = false;
    countLabel.textContent = '';
    return;
  }
  var list = getVisibleNovels();
  countLabel.textContent = (list.length === novels.length)
    ? novels.length + ' ' + plural(novels.length, ['новелла','новеллы','новелл'])
    : 'Показано ' + list.length + ' из ' + novels.length;
  if(list.length === 0){
    emptyEl.textContent = searchQuery.trim() ? 'Ничего не найдено' : 'Нет новелл по выбранным фильтрам';
    emptyEl.hidden = false;
    return;
  }
  emptyEl.hidden = true;
  list.forEach(function(n, idx){ gridEl.appendChild(buildCard(n, idx, animate)); });
}

function updateContinue(){
  var best = null;
  novels.forEach(function(n){
    var p = progressMap[n.id] || 0;
    if(p > 2 && p < 100){
      if(!best || (n.updatedAt || n.createdAt || 0) > (best.updatedAt || best.createdAt || 0)) best = n;
    }
  });
  continueNovel = best;
  if(best){
    var t = best.title.length > 22 ? best.title.slice(0,22).trimEnd() + '…' : best.title;
    continueBtn.textContent = 'Читать далее · «' + t + '»';
    continueBtn.hidden = false;
  }else{
    continueBtn.hidden = true;
  }
}

function renderRecent(){
  var ids = Object.keys(historyMap).sort(function(a,b){ return (historyMap[b]||0) - (historyMap[a]||0); });
  var items = [];
  for(var i=0; i<ids.length && items.length<6; i++){
    var n = novels.find(function(x){ return x.id === ids[i]; });
    if(n) items.push(n);
  }
  recentList.innerHTML = '';
  if(!items.length){ recentRow.hidden = true; return; }
  recentRow.hidden = false;
  items.forEach(function(n){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'recent-item';
    b.textContent = n.title;
    b.title = n.title;
    b.addEventListener('click', function(){ openReader(n, b); });
    recentList.appendChild(b);
  });
}

function buildCard(n, idx, animate){
  var card = document.createElement('article');
  card.className = 'card';
  card.tabIndex = 0;
  card.setAttribute('role','button');
  card.setAttribute('aria-label','Читать новеллу: ' + n.title);
  card.setAttribute('data-id', n.id);
  if(animate) card.style.setProperty('--d', (Math.min(idx,8)*70)+'ms');
  else card.style.animation = 'none';

  var prog = progressMap[n.id] || 0;
  if(prog > 0){
    var bar = document.createElement('div');
    bar.className = 'card-progress';
    bar.style.width = Math.min(100, prog) + '%';
    card.appendChild(bar);
    var progLabel = document.createElement('span');
    progLabel.className = 'card-progress-label';
    progLabel.textContent = Math.min(100, Math.round(prog)) + '%';
    card.appendChild(progLabel);
  }

  var fav = document.createElement('button');
  fav.className = 'icon-btn card-fav' + (n.favorite ? ' faved' : '');
  fav.type = 'button';
  fav.innerHTML = '<svg class="ic" aria-hidden="true"><use href="#icon-heart"></use></svg>';
  fav.setAttribute('aria-pressed', n.favorite ? 'true' : 'false');
  fav.setAttribute('aria-label', n.favorite ? 'Убрать из избранного' : 'В избранное');
  fav.addEventListener('click', function(e){ e.stopPropagation(); toggleFavorite(n, fav); });
  card.appendChild(fav);

  var orn = document.createElement('div');
  orn.className = 'card-orn';
  orn.textContent = '❦';
  orn.setAttribute('aria-hidden','true');
  card.appendChild(orn);

  var tag = document.createElement('span');
  tag.className = 'card-tag' + (n.category === 'canon' ? ' canon' : n.category === 'canon-main' ? ' canon-main' : '');
  tag.textContent = canonLabel(n.category);
  card.appendChild(tag);

  var h = document.createElement('h3');
  h.className = 'card-title';
  h.textContent = n.title;
  card.appendChild(h);

  if(n.author){
    var au = document.createElement('p');
    au.className = 'card-author';
    au.textContent = n.author;
    card.appendChild(au);
  }

  if(n.description){
    var d = document.createElement('p');
    d.className = 'card-desc';
    d.textContent = n.description;
    card.appendChild(d);
  }else{
    var p = document.createElement('p');
    p.className = 'card-preview';
    p.textContent = previewOf(n.text);
    card.appendChild(p);
  }

  var foot = document.createElement('div');
  foot.className = 'card-foot';
  var date = document.createElement('span');
  date.className = 'card-date';
  date.textContent = (n.updatedAt || n.createdAt) ? dateFmt.format(new Date(n.updatedAt || n.createdAt)) : '';
  var cta = document.createElement('span');
  cta.className = 'card-cta';
  cta.textContent = 'Читать →';
  foot.appendChild(date);
  foot.appendChild(cta);
  card.appendChild(foot);

  card.addEventListener('click', function(){ openReader(n, card); });
  card.addEventListener('keydown', function(e){
    if(e.key==='Enter' || e.key===' '){ e.preventDefault(); openReader(n, card); }
  });
  return card;
}

function toggleFavorite(n, btn){
  n.favorite = !n.favorite;
  if(n.favorite) favoriteSet.add(n.id); else favoriteSet.delete(n.id);
  saveFavorites();
  if(btn){
    btn.classList.toggle('faved', n.favorite);
    btn.setAttribute('aria-pressed', String(n.favorite));
    btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop');
  }
  if(readerIsOpen && currentNovel && currentNovel.id === n.id) updateReaderFavBtn();
  if(settings.favOnly && !n.favorite) render(false);
}

function buildToc(){
  var headings = readText.querySelectorAll('.chapter-title');
  tocList.innerHTML = '';
  tocPanel.hidden = true;
  tocBtn.setAttribute('aria-expanded', 'false');
  if(!headings.length){
    tocBtn.hidden = true;
    return;
  }
  tocBtn.hidden = false;
  headings.forEach(function(h){
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'toc-item';
    btn.textContent = h.textContent;
    btn.addEventListener('click', function(){
      var top = h.offsetTop - 88;
      reader.scrollTo({ top: Math.max(0, top), behavior:'smooth' });
      tocPanel.hidden = true;
      tocBtn.setAttribute('aria-expanded', 'false');
    });
    tocList.appendChild(btn);
  });
}
tocBtn.addEventListener('click', function(){
  var willOpen = tocPanel.hidden;
  tocPanel.hidden = !willOpen;
  tocBtn.setAttribute('aria-expanded', String(willOpen));
});
tocClose.addEventListener('click', function(){
  tocPanel.hidden = true;
  tocBtn.setAttribute('aria-expanded', 'false');
});

function syncBodyLock(){
  document.body.classList.toggle('locked', readerIsOpen || settingsIsOpen);
}

function applyTheme(){
  var night = settings.theme === 'night';
  document.body.classList.toggle('night', night);
  document.documentElement.classList.toggle('night-bg', night);
  readerShell.classList.toggle('night', night);
  remainingBadge.classList.toggle('night', night);
  toTop.classList.toggle('night', night);
  siteThemeUse.setAttribute('href', night ? '#icon-sun' : '#icon-moon');
  siteThemeToggle.setAttribute('aria-label', night ? 'Дневная тема' : 'Ночная тема');
  if(settings.atmosphere) updateAtmosphere();
}
siteThemeToggle.addEventListener('click', function(){
  settings.theme = settings.theme === 'night' ? 'day' : 'night';
  saveSettings();
  applyTheme();
  siteThemeToggle.classList.remove('pop'); void siteThemeToggle.offsetWidth; siteThemeToggle.classList.add('pop');
});

/* ---------- настройки ---------- */
function openSettings(){
  fontSizeInput.value = settings.fontSize;
  atmosphereToggle.checked = settings.atmosphere;
  reduceMotionToggle.checked = settings.reduceMotion;
  settingsOverlay.classList.add('open');
  settingsOverlay.setAttribute('aria-hidden', 'false');
  settingsBtn.setAttribute('aria-expanded', 'true');
  settingsIsOpen = true;
  syncBodyLock();
  setTimeout(function(){ settingsClose.focus(); }, 150);
}
function closeSettings(){
  if(!settingsIsOpen) return;
  settingsOverlay.classList.remove('open');
  settingsOverlay.setAttribute('aria-hidden', 'true');
  settingsBtn.setAttribute('aria-expanded', 'false');
  settingsIsOpen = false;
  syncBodyLock();
  try{ settingsBtn.focus({preventScroll:true}); }catch(err){}
}
settingsBtn.addEventListener('click', openSettings);
settingsClose.addEventListener('click', closeSettings);
settingsOverlay.addEventListener('mousedown', function(e){ if(e.target === settingsOverlay) closeSettings(); });

function commitFontSize(){
  var v = parseInt(fontSizeInput.value, 10);
  if(isNaN(v)) v = settings.fontSize;
  v = Math.min(FONT_MAX, Math.max(FONT_MIN, v));
  settings.fontSize = v;
  saveSettings();
  applyFontSize();
  requestAnimationFrame(updateProgressUI);
}
fontSizeInput.addEventListener('change', commitFontSize);
fontSizeInput.addEventListener('blur', commitFontSize);

atmosphereToggle.addEventListener('change', function(){
  settings.atmosphere = atmosphereToggle.checked;
  saveSettings();
  updateAtmosphere();
});
reduceMotionToggle.addEventListener('change', function(){
  settings.reduceMotion = reduceMotionToggle.checked;
  saveSettings();
  document.body.classList.toggle('reduce-motion', settings.reduceMotion);
  updateAtmosphere();
});

resetDataBtn.addEventListener('click', function(){
  if(!window.confirm('Сбросить избранное, прогресс чтения, историю и настройки на этом устройстве? Это нельзя отменить.')) return;
  try{
    localStorage.removeItem(SETTINGS_KEY);
    localStorage.removeItem(PROGRESS_KEY);
    localStorage.removeItem(FAVORITES_KEY);
    localStorage.removeItem(HISTORY_KEY);
  }catch(err){}
  location.reload();
});

/* ---------- сезонная атмосфера ---------- */
var ATMOSPHERE_BY_SEASON = {
  winter: { glyphs: ['❄'], color: 'rgba(146,180,201,.8)', nightColor: 'rgba(232,240,245,.75)', count: 16 },
  spring: { glyphs: ['✿','❀'], color: 'rgba(197,118,140,.65)', nightColor: 'rgba(232,184,168,.6)', count: 12 },
  summer: { glyphs: ['✦','·'], color: 'rgba(196,150,60,.6)', nightColor: 'rgba(232,197,120,.6)', count: 14 },
  autumn: { glyphs: ['❧'], color: 'rgba(180,110,50,.6)', nightColor: 'rgba(216,150,90,.6)', count: 14 }
};
function currentSeason(){
  var m = new Date().getMonth();
  if(m === 11 || m === 0 || m === 1) return 'winter';
  if(m >= 2 && m <= 4) return 'spring';
  if(m >= 5 && m <= 7) return 'summer';
  return 'autumn';
}
function buildAtmosphere(){
  var cfg = ATMOSPHERE_BY_SEASON[currentSeason()];
  var night = settings.theme === 'night';
  atmosphereLayer.innerHTML = '';
  var frag = document.createDocumentFragment();
  for(var i = 0; i < cfg.count; i++){
    var span = document.createElement('span');
    span.className = 'atmosphere-particle';
    span.textContent = cfg.glyphs[i % cfg.glyphs.length];
    var left = Math.random() * 100;
    var duration = 9 + Math.random() * 10;
    var delay = Math.random() * -18;
    var size = 12 + Math.random() * 14;
    var drift = (Math.random() * 120 - 60) + 'px';
    var opacity = 0.4 + Math.random() * 0.4;
    span.style.left = left + '%';
    span.style.fontSize = size + 'px';
    span.style.color = night ? cfg.nightColor : cfg.color;
    span.style.animationDuration = duration + 's';
    span.style.animationDelay = delay + 's';
    span.style.setProperty('--drift', drift);
    span.style.setProperty('--op', opacity);
    frag.appendChild(span);
  }
  atmosphereLayer.appendChild(frag);
}
function updateAtmosphere(){
  var reduced = settings.reduceMotion || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var show = settings.atmosphere && !reduced;
  if(show){
    buildAtmosphere();
    atmosphereLayer.hidden = false;
  }else{
    atmosphereLayer.hidden = true;
    atmosphereLayer.innerHTML = '';
  }
}

function openReader(n, fromEl, skipPush){
  currentNovel = n;
  lastFocused = fromEl || document.activeElement;
  markOpened(n.id);
  fillReader(n, null);
  readerShell.classList.add('open');
  readerShell.setAttribute('aria-hidden','false');
  readerIsOpen = true;
  syncBodyLock();
  if(!skipPush){
    try{ history.pushState({novelReader:n.id}, '', '#' + encodeURIComponent(n.id)); }catch(err){}
  }
  setTimeout(function(){ readerBack.focus(); }, 440);
}
function novelShareUrl(n){
  return location.origin + location.pathname + location.search + '#' + encodeURIComponent(n.id);
}
function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text);
  }
  return new Promise(function(resolve, reject){
    try{
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if(ok) resolve(); else reject();
    }catch(err){ reject(err); }
  });
}
function openNovelById(id, skipPush){
  for(var i=0;i<novels.length;i++){
    if(novels[i].id === id){
      openReader(novels[i], null, skipPush);
      return true;
    }
  }
  return false;
}
function tryOpenFromHash(){
  var raw = location.hash.replace(/^#/, '');
  if(!raw) return;
  var id;
  try{ id = decodeURIComponent(raw); }catch(err){ id = raw; }
  try{ history.replaceState({}, '', location.pathname + location.search); }catch(err){}
  var opened = openNovelById(id, true);
  if(opened){
    try{ history.pushState({novelReader:id}, '', '#' + encodeURIComponent(id)); }catch(err){}
  }else{
    showToast('Новелла по этой ссылке не найдена');
  }
}
function fillReader(n, keepPercent){
  readerBarTitle.textContent = n.title;
  readTitle.textContent = n.title;
  if(n.author){ readAuthor.textContent = n.author; readAuthor.hidden = false; }
  else readAuthor.hidden = true;
  readCanonTag.textContent = canonLabel(n.category);
  readCanonTag.classList.toggle('canon', n.category === 'canon');
  readCanonTag.classList.toggle('canon-main', n.category === 'canon-main');
  readCanonTag.hidden = false;
  if(n.description){ readDesc.textContent = n.description; readDesc.hidden = false; }
  else readDesc.hidden = true;
  var plain = stripInline(n.text);
  var words = wordCount(plain);
  currentTotalMinutes = readingTime(plain);
  var dateStr = (n.updatedAt || n.createdAt) ? dateFmt.format(new Date(n.updatedAt || n.createdAt)) + '  ·  ' : '';
  readMeta.textContent = dateStr +
    '≈ ' + currentTotalMinutes + ' мин чтения  ·  ' +
    words + ' ' + plural(words, ['слово','слова','слов']);
  buildBlocks(readText, n.text);
  buildToc();
  applyFontSize();
  updateReaderFavBtn();
  requestAnimationFrame(function(){
    var max = reader.scrollHeight - reader.clientHeight;
    var p = (keepPercent !== null && keepPercent !== undefined) ? keepPercent : (progressMap[n.id] || 0);
    if(p > 3 && p < 100 && max > 0) reader.scrollTop = Math.round(max * p / 100);
    else if(keepPercent === null) reader.scrollTop = 0;
    updateProgressUI();
  });
}
function backOrClose(stateCheck, fallback){
  try{ if(history.state && stateCheck(history.state)){ history.back(); return; } }catch(err){}
  fallback();
}
function requestCloseReader(){
  if(!readerIsOpen) return;
  backOrClose(function(s){ return s.novelReader; }, closeReaderInternal);
}
function closeReaderInternal(){
  flushProgress();
  readerShell.classList.remove('open');
  readerShell.setAttribute('aria-hidden','true');
  readerIsOpen = false;
  currentNovel = null;
  toTop.classList.remove('visible');
  remainingBadge.classList.remove('visible');
  tocPanel.hidden = true;
  tocBtn.setAttribute('aria-expanded', 'false');
  syncBodyLock();
  render(false);
  if(lastFocused && document.contains(lastFocused)){
    try{ lastFocused.focus({preventScroll:true}); }catch(err){ lastFocused.focus(); }
  }
}
window.addEventListener('popstate', function(){
  if(readerIsOpen){ closeReaderInternal(); }
});
readerBack.addEventListener('click', requestCloseReader);

function currentPercent(){
  var max = reader.scrollHeight - reader.clientHeight;
  return max > 0 ? Math.min(100, Math.round(reader.scrollTop / max * 100)) : 0;
}
function updateProgressUI(){
  var percent = currentPercent();
  progressFill.style.width = percent + '%';
  var showFloaters = readerIsOpen && reader.scrollTop > 500;
  toTop.classList.toggle('visible', showFloaters);
  if(showFloaters && percent < 97 && currentTotalMinutes > 0){
    var remaining = Math.max(1, Math.round(currentTotalMinutes * (100 - percent) / 100));
    remainingBadge.textContent = percent + '% · осталось ≈ ' + remaining + ' ' + plural(remaining, ['минута','минуты','минут']);
    remainingBadge.classList.add('visible');
  }else{
    remainingBadge.classList.remove('visible');
  }
}
function flushProgress(){
  if(!currentNovel) return;
  var p = currentPercent();
  if((progressMap[currentNovel.id] || 0) !== p){
    progressMap[currentNovel.id] = p;
    saveProgress();
  }
}
var scrollTick = false;
var saveScrollTimer = null;
reader.addEventListener('scroll', function(){
  if(!scrollTick){
    scrollTick = true;
    requestAnimationFrame(function(){ scrollTick = false; updateProgressUI(); });
  }
  clearTimeout(saveScrollTimer);
  saveScrollTimer = setTimeout(flushProgress, 350);
}, {passive:true});
toTop.addEventListener('click', function(){ reader.scrollTo({top:0, behavior:'smooth'}); });

function applyFontSize(){
  reader.style.setProperty('--rfs', settings.fontSize + 'px');
  fontMinus.disabled = settings.fontSize <= FONT_MIN;
  fontPlus.disabled = settings.fontSize >= FONT_MAX;
  if(fontSizeInput && document.activeElement !== fontSizeInput) fontSizeInput.value = settings.fontSize;
}
fontMinus.addEventListener('click', function(){
  settings.fontSize = Math.max(FONT_MIN, settings.fontSize - 1);
  saveSettings(); applyFontSize();
  requestAnimationFrame(updateProgressUI);
});
fontPlus.addEventListener('click', function(){
  settings.fontSize = Math.min(FONT_MAX, settings.fontSize + 1);
  saveSettings(); applyFontSize();
  requestAnimationFrame(updateProgressUI);
});
function updateReaderFavBtn(){
  if(!currentNovel) return;
  readerFav.classList.toggle('faved', !!currentNovel.favorite);
  readerFav.setAttribute('aria-pressed', currentNovel.favorite ? 'true' : 'false');
  readerFav.setAttribute('aria-label', currentNovel.favorite ? 'Убрать из избранного' : 'В избранное');
}
readerFav.addEventListener('click', function(){
  if(currentNovel) toggleFavorite(currentNovel, readerFav);
});
readerShare.addEventListener('click', function(){
  if(!currentNovel) return;
  copyToClipboard(novelShareUrl(currentNovel)).then(
    function(){ showToast('Ссылка скопирована'); },
    function(){ showToast('Не удалось скопировать ссылку'); }
  );
});
readerDownload.addEventListener('click', function(){
  if(!currentNovel) return;
  var n = currentNovel;
  var body = n.title + '\n\n' + (n.description ? n.description + '\n\n' : '') + stripInline(n.text);
  var blob = new Blob([body], {type:'text/plain;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = (n.title.replace(/[\\/:*?"<>|]+/g,'').trim() || 'novella') + '.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 500);
  showToast('Файл сохранён');
});

var activeDropdowns = [];
function setupDropdown(rootId, btnId, menuId, labelId, onChange){
  var root = document.getElementById(rootId);
  var btn = document.getElementById(btnId);
  var menu = document.getElementById(menuId);
  var label = document.getElementById(labelId);
  var items = Array.prototype.slice.call(menu.querySelectorAll('.dd-item'));
  function close(){
    if(menu.hidden) return;
    menu.hidden = true;
    btn.setAttribute('aria-expanded','false');
  }
  function open(){
    closeAllDropdowns(root);
    menu.hidden = false;
    btn.setAttribute('aria-expanded','true');
  }
  function setValue(val, fire){
    items.forEach(function(it){
      var active = it.getAttribute('data-value') === val;
      it.classList.toggle('active', active);
      it.setAttribute('aria-selected', String(active));
      if(active) label.textContent = it.textContent;
    });
    if(fire) onChange(val);
  }
  btn.addEventListener('click', function(e){
    e.stopPropagation();
    if(menu.hidden) open(); else close();
  });
  items.forEach(function(it){
    it.addEventListener('click', function(){
      setValue(it.getAttribute('data-value'), true);
      close();
      btn.focus();
    });
  });
  activeDropdowns.push({ root: root, close: close });
  return { setValue: setValue, close: close };
}
function closeAllDropdowns(exceptRoot){
  activeDropdowns.forEach(function(d){
    if(d.root !== exceptRoot) d.close();
  });
}
document.addEventListener('click', function(){ closeAllDropdowns(); });
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') closeAllDropdowns();
});

var sortDD = setupDropdown('sortDD','sortDDBtn','sortDDMenu','sortDDLabel', function(val){
  settings.sort = val; saveSettings(); render(false);
});
var canonDD = setupDropdown('canonDD','canonDDBtn','canonDDMenu','canonDDLabel', function(val){
  settings.canonFilter = val; saveSettings(); render(false);
});

favFilter.addEventListener('click', function(){
  settings.favOnly = !settings.favOnly;
  favFilter.classList.toggle('active', settings.favOnly);
  favFilter.setAttribute('aria-pressed', settings.favOnly ? 'true' : 'false');
  saveSettings();
  render(false);
});
var doSearch = debounce(function(){ searchQuery = searchInput.value; render(false); }, 180);
searchInput.addEventListener('input', doSearch);
continueBtn.addEventListener('click', function(){ if(continueNovel) openReader(continueNovel, continueBtn); });

document.addEventListener('keydown', function(e){
  if(e.key !== 'Escape') return;
  if(settingsIsOpen){ e.preventDefault(); closeSettings(); return; }
  if(readerIsOpen){
    e.preventDefault();
    if(!tocPanel.hidden){ tocPanel.hidden = true; tocBtn.setAttribute('aria-expanded','false'); return; }
    requestCloseReader();
  }
});

sortDD.setValue(settings.sort, false);
canonDD.setValue(settings.canonFilter, false);
favFilter.classList.toggle('active', settings.favOnly);
favFilter.setAttribute('aria-pressed', settings.favOnly ? 'true' : 'false');
applyFontSize();
applyTheme();
document.body.classList.toggle('reduce-motion', settings.reduceMotion);
updateAtmosphere();
loadNovels();
})();
</script>
